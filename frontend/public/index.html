<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
      <!-- 🛡️ SENTINEL ACTIVE DEFENSE CLIENT-SIDE SHIELD -->
    <script>
      (function() {
        var SENTINEL_URL = "https://sentinel-aiops-engine.onrender.com";

        function getClientIdentity() {
          var ua = navigator.userAgent || "";
          var name = "Desktop";
          var ipOffset = 100;
          if (/android/i.test(ua)) { name = "Android Mobile"; ipOffset = 140; }
          else if (/iphone|ipad/i.test(ua)) { name = "Apple Mobile"; ipOffset = 160; }
          else if (/windows/i.test(ua)) { name = "Windows PC"; ipOffset = 100; }
          else if (/mac/i.test(ua)) { name = "Mac"; ipOffset = 120; }
          else if (/linux/i.test(ua)) { name = "Linux PC"; ipOffset = 180; }

          var screenSig = (window.screen ? (window.screen.width + "x" + window.screen.height + "x" + window.screen.colorDepth) : "") + ua;
          var sigHash = 0;
          for (var j = 0; j < screenSig.length; j++) {
            sigHash = (sigHash * 31 + screenSig.charCodeAt(j)) % 29;
          }

          var id = localStorage.getItem("sentinel_device_id");
          if (!id) {
            id = "dev-" + Math.abs(sigHash).toString(36) + Math.random().toString(36).substring(2, 6);
            try { localStorage.setItem("sentinel_device_id", id); } catch (_) {}
          }

          var localIp = localStorage.getItem("sentinel_local_ip");
          if (!localIp) {
            localIp = "192.168.1." + (ipOffset + Math.abs(sigHash));
            try { localStorage.setItem("sentinel_local_ip", localIp); } catch (_) {}
          }
          return { id: id, name: name, localIp: localIp };
        }

        var dev = getClientIdentity();

        function isQuarantineTarget(data, currentDev) {
          if (!data || !data.blocked) return false;
          var targetDevName = (data.device_name || "").trim();
          var targetLocalIp = (data.local_ip || "").trim();

          // 1. Cross-Platform Disambiguation (Mobile vs PC):
          if (targetDevName && currentDev.name) {
            var isTargetMob = /mobile|phone|android|iphone|ipad/i.test(targetDevName);
            var isCurrentMob = /mobile|phone|android|iphone|ipad/i.test(currentDev.name);
            if (isTargetMob !== isCurrentMob) {
              return false; // Different device platform category -> spare this terminal!
            }
          }

          // 2. Intra-Platform LAN IP Disambiguation:
          if (targetLocalIp && currentDev.localIp && targetLocalIp !== currentDev.localIp) {
            return false; // Different local LAN IP -> spare!
          }

          return true;
        }

        function lockScreenAndRedirect(data) {
          if (!isQuarantineTarget(data, dev)) return;

          var clientIp = data.ip || "Attacker IP";
          var incident = data.incident_id || "INC-2037";
          var status = data.status || "PERMANENT BAN";
          var reason = data.reason || "Volumetric request surge / SRE policy violation";
          var targetUrl = data.challenge_url || (SENTINEL_URL + "/challenge?ip=" + encodeURIComponent(clientIp) + "&device_id=" + encodeURIComponent(dev.id) + "&device_name=" + encodeURIComponent(dev.name) + "&local_ip=" + encodeURIComponent(dev.localIp));

          // Replace entire DOM with cyber red quarantine card
          document.body.innerHTML = `
            <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#080c14;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;">
              <div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.35);border-radius:18px;padding:36px;max-width:540px;width:100%;box-shadow:0 0 50px rgba(239,68,68,0.25);text-align:center;">
                <div style="display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:9999px;background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.4);margin-bottom:16px;letter-spacing:1px;">
                  SENTINEL ACTIVE DEFENSE ENFORCED
                </div>
                <h1 style="color:#ef4444;font-size:24px;margin:0 0 10px 0;font-weight:700;">🚨 HTTP 429 - ACCESS QUARANTINED</h1>
                <p style="color:#94a3b8;font-size:13.5px;line-height:1.6;margin:0 0 20px 0;">
                  Your device terminal (<b style="color:#fca5a5;">${dev.localIp || clientIp}</b>) has been isolated by Sentinel SmartOps Autonomous SRE Defense.
                </p>
                <div style="background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;margin-bottom:24px;text-align:left;font-family:monospace;font-size:12px;color:#cbd5e1;line-height:1.8;">
                  <div><b>Incident ID:</b> <span style="color:#38bdf8;">${incident}</span></div>
                  <div><b>Device Identity:</b> <span style="color:#a78bfa;">${dev.name} (${dev.localIp})</span></div>
                  <div><b>Enforcement:</b> <span style="color:#ef4444;">${status}</span></div>
                  <div><b>Reason:</b> ${reason}</div>
                </div>
                <a href="${targetUrl}" style="display:inline-block;background:#ef4444;color:#fff;font-weight:600;font-size:13.5px;text-decoration:none;padding:12px 28px;border-radius:8px;box-shadow:0 4px 16px rgba(239,68,68,0.4);">
                  Inspect Security Challenge &rarr;
                </a>
                <p style="font-size:11px;color:#64748b;margin-top:16px;margin-bottom:0;">Redirecting automatically in 3 seconds...</p>
              </div>
            </div>
          `;

          setTimeout(function() {
            window.location.href = targetUrl;
          }, 3000);
        }

        // 1. Initial Check on Page Load with complete device credentials
        var checkClientUrl = SENTINEL_URL + "/api/security/check-client?device_id=" + encodeURIComponent(dev.id) + "&device_name=" + encodeURIComponent(dev.name) + "&local_ip=" + encodeURIComponent(dev.localIp);
        fetch(checkClientUrl, {
          cache: "no-store",
          headers: {
            "X-Device-Id": dev.id,
            "X-Device-Name": dev.name,
            "X-Local-Ip": dev.localIp
          }
        })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data && data.blocked) {
              lockScreenAndRedirect(data);
            }
          })
          .catch(function() {});

        // 2. Fetch API Interceptor: attaches device headers to all outgoing requests and catches any 429
        var origFetch = window.fetch;
        window.fetch = function(url, options) {
          options = options || {};
          options.headers = options.headers || {};
          if (typeof options.headers.set === "function") {
            options.headers.set("X-Device-Id", dev.id);
            options.headers.set("X-Device-Name", dev.name);
            options.headers.set("X-Local-Ip", dev.localIp);
          } else {
            options.headers["X-Device-Id"] = dev.id;
            options.headers["X-Device-Name"] = dev.name;
            options.headers["X-Local-Ip"] = dev.localIp;
          }
          return origFetch.call(this, url, options).then(function(response) {
            if (response && response.status === 429) {
              response.clone().json().then(function(json) {
                if (json && json.blocked) lockScreenAndRedirect(json);
              }).catch(function() {
                lockScreenAndRedirect({ ip: dev.localIp || "Current IP", device_id: dev.id, local_ip: dev.localIp });
              });
            }
            return response;
          });
        };
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
